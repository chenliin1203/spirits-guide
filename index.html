<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微醺酒類資料網 | Spirits & Mixology Guide</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>🥃 微醺酒類資料網</h1>

        <div class="filter-buttons" id="filter-buttons">
            <button class="filter-btn active" data-category="all">全部酒款</button>
            <button class="filter-btn" data-category="基酒">基酒</button>
            <button class="filter-btn" data-category="利口酒">利口酒</button>
            <button class="filter-btn" data-category="經典調酒">經典調酒</button>
